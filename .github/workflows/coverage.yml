name: Coverage

on:
  push:
    branches: [ main ]
  # Every pull request, stacked ones included (their base is not main).
  pull_request:

# Line and function coverage of the pure-Rust unit tests, built for PostgreSQL 18
# (the release target). The SQL suites (ci.yml) exercise the installed extension
# and are not counted here.
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain and llvm-tools
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add llvm-tools-preview

      - name: Install PostgreSQL 18 (PGDG)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18 postgresql-server-dev-18 mold

      - name: Install pgrx and cargo-llvm-cov
        run: |
          cargo install --locked cargo-pgrx --version 0.17.0
          cargo install --locked cargo-llvm-cov
          cargo pgrx init --pg18 /usr/lib/postgresql/18/bin/pg_config

      # Linked as clippy.yml's unit job links its tests: PostgreSQL symbols only
      # resolve inside a server, mold keeps them out of the dynamic imports, and
      # #[pg_test]s (pg_test_*) need a server.
      - name: Measure unit-test coverage
        run: |
          set -o pipefail
          RUSTFLAGS="-C link-arg=-fuse-ld=mold -C link-arg=-Wl,--unresolved-symbols=ignore-all" \
            cargo llvm-cov --lib --no-default-features --features pg18 --summary-only \
              -- --skip pg_test_ | tee coverage-summary.txt
          cargo llvm-cov report --lcov --output-path lcov.info
          {
            echo "## Unit-test coverage (PostgreSQL 18)"
            echo
            echo '```'
            grep -E '^(Filename|TOTAL)' coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage-summary.txt
          retention-days: 30
