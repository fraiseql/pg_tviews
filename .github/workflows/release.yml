name: Release

on:
  push:
    tags:
      - 'v*'
  # A dry run (the default) builds and signs what a release would ship and keeps it
  # as a workflow artifact: no release is created and nothing reaches crates.io.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign only; create no release and publish nothing
        type: boolean
        default: true

# Read-only by default. Each job asks for what it needs, and no job that compiles
# third-party code (the gates, build) holds a write, id-token or crates.io
# credential: sign-and-release only verifies and signs the files build made, and
# publish uploads a crate build verified, without compiling it.
permissions:
  contents: read

jobs:
  # Nothing is built or published unless the commit passes every suite, the
  # lints, and confiture's TVIEW suites at the pinned confiture ref.
  ci:
    uses: ./.github/workflows/ci.yml
  lint:
    uses: ./.github/workflows/clippy.yml
  confiture:
    uses: ./.github/workflows/confiture.yml
  upgrade:
    uses: ./.github/workflows/upgrade.yml

  build:
    needs: [ci, lint, confiture, upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.name.outputs.release }}
      publish: ${{ steps.name.outputs.publish }}
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install PostgreSQL 18 (PGDG)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18 postgresql-server-dev-18

      - name: Install pgrx
        run: |
          cargo install --locked cargo-pgrx --version 0.17.0
          # `cargo pgrx package` needs an initialized PGRX_HOME; without this the
          # build fails with "$PGRX_HOME does not exist".
          cargo pgrx init --pg18 /usr/lib/postgresql/18/bin/pg_config

      - name: Name the release and check the tag matches it
        id: name
        env:
          # A tag push releases; so does a dispatch on a tag with dry_run unset.
          PUBLISH: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry_run == false) }}
        run: |
          VERSION=$(grep "^version" Cargo.toml | sed 's/.*version = "\(.*\)".*/\1/')
          echo "release=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          [ "$PUBLISH" = true ] || exit 0
          # main carries the next version under ## [Unreleased]; a release stamps the
          # CHANGELOG heading before it is tagged (docs/development/extension-versioning.md).
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${VERSION}"
            exit 1
          fi
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' heading"
            exit 1
          fi

      - name: Fetch the locked dependency tree
        run: cargo fetch --locked

      # publish uploads the crate without compiling it: the build that proves it
      # compiles from its packaged sources runs here, with no credential,
      # before anything is written into the checkout (cargo package wants it clean).
      - name: Check the crate builds from its package
        run: cargo package --locked --no-default-features --features pg18

      - name: Build extension
        env:
          # `cargo pgrx package` has no --locked: offline, it builds only what
          # the locked fetch above brought.
          CARGO_NET_OFFLINE: "true"
          RELEASE: ${{ steps.name.outputs.release }}
        run: |
          # default features already target pg18 (see Cargo.toml [features]).
          PG_CONFIG=/usr/lib/postgresql/18/bin/pg_config
          cargo pgrx package --pg-config "$PG_CONFIG"
          # Documented layout (docs/development/extension-versioning.md):
          #   lib/pg_tviews.so       -> $(pg_config --pkglibdir)
          #   extension/pg_tviews.*  -> $(pg_config --sharedir)/extension
          # extension/ holds the control file, the install script and the upgrade
          # scripts from sql/.
          pkg=target/release/pg_tviews-pg18
          mkdir -p dist/lib dist/extension release
          cp "${pkg}$("$PG_CONFIG" --pkglibdir)/pg_tviews.so" dist/lib/
          cp "${pkg}$("$PG_CONFIG" --sharedir)"/extension/pg_tviews* dist/extension/
          # Deterministic archive (as scripts/reproducible-build.sh writes it).
          tar --sort=name --mtime=@1 --owner=0 --group=0 --numeric-owner \
            -cf - -C dist lib extension | gzip -n > "release/pg_tviews-${RELEASE}.tar.gz"
          tar tzf "release/pg_tviews-${RELEASE}.tar.gz"
          (cd release && sha256sum "pg_tviews-${RELEASE}.tar.gz" > SHA256SUMS)

      - name: Install SBOM tools
        run: |
          cargo install --locked cargo-sbom --version 0.10.0
          cargo install --locked cargo-cyclonedx --version 0.5.9

      - name: Generate SBOM
        env:
          RELEASE: ${{ steps.name.outputs.release }}
        run: |
          ./scripts/generate-sbom.sh "$RELEASE"
          mv sbom release/

      - name: Record the digest of every file
        id: digest
        working-directory: release
        run: |
          {
            echo 'sha256<<SHA256_EOF'
            find . -type f -print0 | sort -z | xargs -0 sha256sum
            echo 'SHA256_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 5

  # Signs and releases the files build made, checked against the digests build
  # recorded. No checkout, no cargo: nothing here runs code from the repository
  # or its dependencies.
  sign-and-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      id-token: write       # Sigstore keyless signing
      attestations: write   # actions/attest-build-provenance
    env:
      RELEASE: ${{ needs.build.outputs.release }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Verify every file is one build made, unchanged
        working-directory: release
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          printf '%s\n' "$SHA256" > "$RUNNER_TEMP/expected.sha256"
          sha256sum --strict -c "$RUNNER_TEMP/expected.sha256"
          # ... and nothing came with them.
          diff <(find . -type f | sort) <(awk '{ print $2 }' "$RUNNER_TEMP/expected.sha256" | sort)

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign with Sigstore (keyless)
        working-directory: release
        run: |
          for f in "pg_tviews-${RELEASE}.tar.gz" \
                   "sbom/pg_tviews-${RELEASE}.spdx.json" \
                   "sbom/pg_tviews-${RELEASE}.cyclonedx.json"; do
            cosign sign-blob --yes --bundle "${f}.sigstore" "$f"
          done

      # Provenance of the tarball users download.
      - name: Generate provenance
        if: needs.build.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/pg_tviews-${{ needs.build.outputs.release }}.tar.gz

      - name: Create release
        if: needs.build.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release/pg_tviews-${{ needs.build.outputs.release }}.tar.gz
            release/SHA256SUMS
            release/pg_tviews-${{ needs.build.outputs.release }}.tar.gz.sigstore
            release/sbom/pg_tviews-${{ needs.build.outputs.release }}.spdx.json
            release/sbom/pg_tviews-${{ needs.build.outputs.release }}.spdx.json.sigstore
            release/sbom/pg_tviews-${{ needs.build.outputs.release }}.cyclonedx.json
            release/sbom/pg_tviews-${{ needs.build.outputs.release }}.cyclonedx.json.sigstore
            release/sbom/pg_tviews-${{ needs.build.outputs.release }}.sbom.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the dry run's signed files
        if: needs.build.outputs.publish != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: release/
          if-no-files-found: error
          retention-days: 1

  # crates.io gets the release once it is signed and released, after the owner
  # approves the crates-io environment's deployment. Cancelling the run before
  # approving stops it here. The credential is a short-lived token exchanged for
  # this run's OIDC identity (crates.io trusted publishing); the crate is not
  # compiled here (build checked it).
  publish:
    needs: [build, sign-and-release]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write       # crates.io trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: Publish to crates.io
        run: cargo publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
