name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write       # Required for Sigstore keyless signing
  attestations: write   # Required for actions/attest-build-provenance to persist the attestation

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install PostgreSQL 18 (PGDG)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18 postgresql-server-dev-18

      - name: Install pgrx
        run: |
          cargo install --locked cargo-pgrx --version 0.17.0
          # `cargo pgrx package` needs an initialized PGRX_HOME; without this the
          # build fails with "$PGRX_HOME does not exist".
          cargo pgrx init --pg18 /usr/lib/postgresql/18/bin/pg_config

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Check the tag matches the release
        run: |
          # main carries the next version under ## [Unreleased]; a release stamps the
          # CHANGELOG heading before it is tagged (docs/development/extension-versioning.md).
          VERSION=$(grep "^version" Cargo.toml | sed 's/.*version = "\(.*\)".*/\1/')
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${VERSION}"
            exit 1
          fi
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' heading"
            exit 1
          fi

      - name: Build extension
        run: |
          # default features already target pg18 (see Cargo.toml [features]).
          PG_CONFIG=/usr/lib/postgresql/18/bin/pg_config
          cargo pgrx package --pg-config "$PG_CONFIG"
          # Documented layout (docs/development/extension-versioning.md):
          #   lib/pg_tviews.so       -> $(pg_config --pkglibdir)
          #   extension/pg_tviews.*  -> $(pg_config --sharedir)/extension
          # extension/ holds the control file, the install script and the upgrade
          # scripts from sql/.
          pkg=target/release/pg_tviews-pg18
          mkdir -p dist/lib dist/extension
          cp "${pkg}$("$PG_CONFIG" --pkglibdir)/pg_tviews.so" dist/lib/
          cp "${pkg}$("$PG_CONFIG" --sharedir)"/extension/pg_tviews* dist/extension/
          tar czf pg_tviews-${{ github.ref_name }}.tar.gz -C dist lib extension
          tar tzf pg_tviews-${{ github.ref_name }}.tar.gz

      - name: Install SBOM tools
        # scripts/generate-sbom.sh calls `cargo sbom` and `cargo cyclonedx`; the
        # release job (unlike sbom.yml) did not install them, so the SBOM step
        # failed with "no such command: sbom" before "Create release" ran.
        run: |
          cargo install cargo-sbom
          cargo install cargo-cyclonedx

      - name: Generate SBOM
        run: ./scripts/generate-sbom.sh ${{ github.ref_name }}

      - name: Sign with Sigstore (keyless)
        run: |
          # Sign release tarball
          cosign sign-blob --yes \
            --bundle pg_tviews-${{ github.ref_name }}.tar.gz.sigstore \
            pg_tviews-${{ github.ref_name }}.tar.gz

          # Sign SBOM files
          cosign sign-blob --yes \
            --bundle sbom/pg_tviews-${{ github.ref_name }}.spdx.json.sigstore \
            sbom/pg_tviews-${{ github.ref_name }}.spdx.json

          cosign sign-blob --yes \
            --bundle sbom/pg_tviews-${{ github.ref_name }}.cyclonedx.json.sigstore \
            sbom/pg_tviews-${{ github.ref_name }}.cyclonedx.json

      - name: Generate provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: pg_tviews-${{ github.ref_name }}.tar.gz

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            pg_tviews-${{ github.ref_name }}.tar.gz
            pg_tviews-${{ github.ref_name }}.tar.gz.sigstore
            sbom/pg_tviews-${{ github.ref_name }}.spdx.json
            sbom/pg_tviews-${{ github.ref_name }}.spdx.json.sigstore
            sbom/pg_tviews-${{ github.ref_name }}.cyclonedx.json
            sbom/pg_tviews-${{ github.ref_name }}.cyclonedx.json.sigstore
            sbom/pg_tviews-${{ github.ref_name }}.sbom.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}