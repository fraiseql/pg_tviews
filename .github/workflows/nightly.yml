name: Nightly (assertions)

# The regression, differential and isolation suites on a PostgreSQL 18 built
# with --enable-cassert --enable-debug (what `cargo pgrx init ... download`
# builds): an assertion in the server catches what a release build lets pass
# silently (a lock or memory context misused by the extension). Then the
# concurrent fuzzer, long: staleness it finds is transient, so only a long run
# with a checker reading throughout catches the rare interleavings.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PGRX_VERSION: "0.17.0"
  JSONB_DELTA_REPO: "https://github.com/evoludigit/jsonb_delta.git"
  JSONB_DELTA_REF: "32e7fd6bc724ffec31350fc3d02dbf50050d832f"  # v0.3.2

jobs:
  cassert:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install PostgreSQL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config bison flex libreadline-dev \
            zlib1g-dev libssl-dev libxml2-dev libxslt1-dev libicu-dev clang libclang-dev

      - name: Build PostgreSQL 18 with assertions (pgrx)
        run: |
          cargo install --locked cargo-pgrx --version "${PGRX_VERSION}"
          cargo pgrx init --pg18 download
          pgdir="$(ls -d "$HOME"/.pgrx/18.*/ | head -1)"
          # dblink and pg_stat_statements are used by the regression suite.
          make -C "${pgdir}contrib" -j"$(nproc)" install >/dev/null
          {
            echo "PG_CONFIG=${pgdir}pgrx-install/bin/pg_config"
            echo "PGHOST=localhost"
            echo "PGPORT=28818"
          } >> "$GITHUB_ENV"
          echo "${pgdir}pgrx-install/bin" >> "$GITHUB_PATH"

      - name: Build and install pg_tviews and jsonb_delta
        run: |
          cargo pgrx install --release --no-default-features --features "pg18 test-hooks" --pg-config "$PG_CONFIG"
          git init -q /tmp/jsonb_delta && git -C /tmp/jsonb_delta fetch -q --depth 1 "${JSONB_DELTA_REPO}" "${JSONB_DELTA_REF}" && git -C /tmp/jsonb_delta checkout -q FETCH_HEAD
          (cd /tmp/jsonb_delta && cargo pgrx install --release --no-default-features \
             --features pg18 --pg-config "$PG_CONFIG")

      - name: Start the cluster with pg_tviews preloaded
        run: |
          cargo pgrx start pg18
          conf="$HOME/.pgrx/data-18/postgresql.conf"
          echo "shared_preload_libraries = 'pg_tviews'" >> "$conf"
          echo "max_prepared_transactions = 10" >> "$conf"
          cargo pgrx stop pg18 && cargo pgrx start pg18
          # initdb's superuser is the runner's OS user; the suites run as postgres,
          # as in ci.yml.
          psql -d postgres -U "$USER" -qc "DO \$\$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'postgres') THEN
              CREATE ROLE postgres SUPERUSER LOGIN;
            END IF; END \$\$"
          echo "PGUSER=postgres" >> "$GITHUB_ENV"

      - name: Regression suite
        run: ./test/run_regression_tests.sh

      - name: Differential suite (every mode)
        run: |
          source test/lib/modes.sh
          MODES="$MODES_ALL" ./test/sql/differential/run.sh 120 "1 2 3 4 5 6 7 8"

      # Three new seeds each night (the date and 1-3): a failure prints its seed,
      # which replays anywhere.
      - name: Generated shapes (every mode)
        run: |
          source test/lib/modes.sh
          day="$(date -u +%Y%m%d)"
          MODES="$MODES_ALL" ./test/sql/differential/gen/run.sh 20 "${day}1 ${day}2 ${day}3" 60

      - name: Isolation suite
        run: ./test/isolation/run.sh

      # TVIEWs over tables a logical replication subscription writes are refused,
      # and reported when subscribed later (the apply worker fires no statement
      # trigger).
      - name: Logical replication subscriber
        if: ${{ !cancelled() }}
        run: PGBIN="$(dirname "$PG_CONFIG")" ./test/replication/logical_subscriber.sh

      # 30 minutes of mixed transactions (four seeds in every mode), then 10 of
      # value-only writes. KEEP=1 keeps a failed seed's database for the dump below.
      - name: Concurrent fuzzer (30 min mixed, 10 min values)
        if: ${{ !cancelled() }}
        run: |
          source test/lib/modes.sh
          MODES="$MODES_ALL" KEEP=1 ./test/concurrency/fuzz/run.sh 150 "1 2 3 4" 8 mixed
          KEEP=1 ./test/concurrency/fuzz/run.sh 600 "1" 8 values

      # #278: a 21000 seen once at 32 clients, every statement from the differential
      # harness. Each refresh upsert logs what a 21000 conflicted with (DIAG21000).
      - name: Concurrent fuzzer (10 min, 32 clients, MIX=100, 21000 diagnostic)
        if: ${{ !cancelled() }}
        run: |
          MIX=100 EXTRA_PGOPTIONS="-c pg_tviews.test_diag_21000=on" KEEP=1 \
            ./test/concurrency/fuzz/run.sh 600 "1" 32 mixed

      - name: 21000 diagnostics
        if: failure()
        run: grep -A3 DIAG21000 "$HOME/.pgrx/18.log" || echo "no DIAG21000 in the server log"

      - name: Keep a failed fuzz seed's database
        if: failure()
        run: |
          mkdir -p fuzz-kept
          for d in $(psql -d postgres -Atc "SELECT datname FROM pg_database WHERE datname LIKE 'pg_tviews_fuzz_%_seed%'"); do
            pg_dump -d "$d" -Fc -f "fuzz-kept/$d.dump"
          done

      - name: Upload kept fuzz databases
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-kept
          path: fuzz-kept/
          if-no-files-found: ignore

      - name: Server log
        if: failure()
        run: tail -200 "$HOME/.pgrx/18.log"
