name: Clippy Strict

on: [push, pull_request]

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install PostgreSQL 16 (Ubuntu default)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-server-dev-16
      - name: Start PostgreSQL service
        run: |
          sudo systemctl start postgresql
          sudo systemctl enable postgresql
      - name: Install pgrx
        run: |
          cargo install --locked cargo-pgrx --version 0.17.0
          cargo pgrx init --pg16 /usr/lib/postgresql/16/bin/pg_config
      - name: Run strict clippy
        run: |
          # Lint policy (clippy::all + clippy::pedantic = deny, with reviewed
          # selective allows) lives in [lints.clippy] in Cargo.toml so CI and
          # local `cargo clippy` enforce exactly the same rules.
          cargo clippy --all-targets --no-default-features --features pg16 -- -D warnings
      - name: Check for SQL quote-doubling anti-pattern
        run: |
          # Exclude ddl/convert.rs:370 — justified: DDL VALUES clause, data from DB, ::jsonb cast
          if grep -rn "replace.*'\\\\''.*''" src/ | grep -v 'ddl/convert.rs.*escaped_data'; then
            echo "::error::Found quote-doubling pattern. Use parameterized queries instead."
            exit 1
          fi