name: Clippy Strict

on:
  push:
    branches: [ main ]
  # Every pull request, stacked ones included (their base is not main).
  pull_request:
  # The release runs it before building anything.
  workflow_call:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Check formatting
        run: cargo fmt --check
      - name: Check every PostgreSQL callback carries #[pg_guard]
        run: scripts/check-ffi-guards.sh
      - name: Check the refresh path's modules only call downward
        run: scripts/check-layers.sh
      - name: Check no catalog SQL resolves an object name
        run: scripts/check-name-resolution.sh
      - name: Check the name check flags every form it should
        run: test/scripts/check-name-resolution-test.sh
      - name: Check every PL/pgSQL handler of all errors keeps its SQLSTATE
        run: scripts/check-plpgsql-handlers.sh
      - name: Check plans are read through the typed plan and the SQL decoders only
        run: scripts/check-plan-readers.sh
      - name: Check the lower modules form layers (no dependency cycle)
        run: scripts/check-module-layers.sh
      - name: Check SPI is reached through src/utils/spi.rs only
        run: scripts/check-spi-facade.sh
      - name: Check the lock is tracked, tokens are least-privilege and refs are commits
        run: scripts/check-ci-hardening.sh

  unit:
    name: unit (pg${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17", "18"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install PostgreSQL ${{ matrix.pg }} (PGDG)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-${{ matrix.pg }}" "postgresql-server-dev-${{ matrix.pg }}" mold
      - name: Install pgrx
        run: |
          cargo install --locked cargo-pgrx --version 0.17.0
          cargo pgrx init "--pg${{ matrix.pg }}" "/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config"
      - name: Run pure-Rust unit tests
        run: |
          # PostgreSQL symbols only resolve inside a server, so let the linker
          # ignore them. Link with mold: GNU ld and lld keep the unresolved
          # symbols as dynamic imports, and the test binary then fails to load
          # ("symbol lookup error"); mold resolves them statically. Behaviour that
          # needs a server is tested by the SQL suites (ci.yml).
          RUSTFLAGS="-C link-arg=-fuse-ld=mold -C link-arg=-Wl,--unresolved-symbols=ignore-all" \
            cargo test --lib --no-default-features --features "pg${{ matrix.pg }}"

  clippy:
    name: clippy (pg${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17", "18"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Toolchain version comes from rust-toolchain.toml (bump it in a dedicated PR).
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install PostgreSQL ${{ matrix.pg }} (PGDG)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-${{ matrix.pg }}" "postgresql-server-dev-${{ matrix.pg }}"
      - name: Install pgrx
        run: |
          cargo install --locked cargo-pgrx --version 0.17.0
          cargo pgrx init "--pg${{ matrix.pg }}" "/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config"
      - name: Run strict clippy
        run: |
          # Lint policy (clippy::all + clippy::pedantic = deny, with reviewed
          # selective allows) lives in [lints.clippy] in Cargo.toml so CI and
          # local `cargo clippy` enforce exactly the same rules.
          cargo clippy --all-targets --no-default-features --features "pg${{ matrix.pg }}" -- -D warnings
      - name: Check for SQL quote-doubling anti-pattern
        run: |
          # utils::quote_literal is the one literal built by hand (PostgreSQL's
          # quote_literal rules); everything else binds parameters.
          if grep -rn "replace.*'\\\\''.*''" src/ | grep -v '^src/utils/mod.rs:.*let quoted = text.replace'; then
            echo "::error::Found quote-doubling pattern. Use parameterized queries instead."
            exit 1
          fi
