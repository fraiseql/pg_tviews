name: Upgrade

# An install of the previous release, updated to the commit under test, must have
# exactly the catalog of a fresh install and keep its TVIEWs working; until the
# update, writes are refused with the revision error. An install of an older
# release (0.1.0-beta.25 here) has no update: it is dropped and recreated
# (docs/operations/upgrade.md, docs/development/extension-versioning.md).

on:
  push:
    branches: [ main ]
  # Every pull request, stacked ones included (their base is not main).
  pull_request:
  # The release runs it before building anything.
  workflow_call:

permissions:
  contents: read

env:
  PG_MAJOR: "18"
  PGRX_VERSION: "0.17.0"
  JSONB_DELTA_REPO: "https://github.com/evoludigit/jsonb_delta.git"
  JSONB_DELTA_REF: "f5c495030a92fcf112be098e9ef15f8f24d4a728"  # v0.3.0

jobs:
  upgrade-path:
    name: upgrade-path (${{ matrix.from }}, pg${{ matrix.pg }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PG_MAJOR: ${{ matrix.pg }}
    strategy:
      fail-fast: false
      matrix:
        # `previous`: the latest release, updated by `ALTER EXTENSION UPDATE`;
        # `v0.1.0-beta.25`: an older one, dropped and recreated. Releases ship a
        # PostgreSQL 18 build: on another major the release is built from its tag.
        from: [ previous ]
        pg: [ "18", "16" ]
        include:
          - from: v0.1.0-beta.25
            pg: "18"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find the release to upgrade from
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ matrix.from }}" = previous ]; then
            tag="$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 \
                   --json tagName -q '.[0].tagName')"
          else
            tag="${{ matrix.from }}"
          fi
          mkdir -p /tmp/previous
          gh release download "$tag" -R "$GITHUB_REPOSITORY" \
            -p "pg_tviews-${tag}.tar.gz" -D /tmp/previous
          tar xzf "/tmp/previous/pg_tviews-${tag}.tar.gz" -C /tmp/previous
          prev="$(sed -n "s/^default_version = '\(.*\)'/\1/p" /tmp/previous/extension/pg_tviews.control)"
          cur="$(grep '^version' Cargo.toml | sed 's/.*version = "\(.*\)".*/\1/')"
          if [ "$prev" = "$cur" ]; then
            echo "::notice::${cur} is the released version; nothing to upgrade from"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The previous release updates by one script; an older one is recreated.
          if [ "${{ matrix.from }}" = previous ]; then
            if [ ! -f "sql/pg_tviews--${prev}--${cur}.sql" ]; then
              echo "::error::no update script from ${prev} to ${cur}"
              exit 1
            fi
            echo "mode=update" >> "$GITHUB_OUTPUT"
          else
            echo "mode=recreate" >> "$GITHUB_OUTPUT"
          fi
          echo "Upgrading ${prev} -> ${cur}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up PostgreSQL, pgrx and jsonb_delta
        if: steps.previous.outputs.skip != 'true'
        uses: ./.github/actions/setup-postgres
        with:
          pg-major: ${{ env.PG_MAJOR }}
          pgrx-version: ${{ env.PGRX_VERSION }}
          jsonb-delta-repo: ${{ env.JSONB_DELTA_REPO }}
          jsonb-delta-ref: ${{ env.JSONB_DELTA_REF }}

      - name: Install the previous release (its tarball on 18, its tag built elsewhere)
        if: steps.previous.outputs.skip != 'true'
        run: |
          pg_config="/usr/lib/postgresql/${PG_MAJOR}/bin/pg_config"
          if [ "${PG_MAJOR}" = 18 ]; then
            sudo cp /tmp/previous/lib/pg_tviews.so "$("$pg_config" --pkglibdir)/"
            sudo cp /tmp/previous/extension/pg_tviews* "$("$pg_config" --sharedir)/extension/"
          else
            git fetch -q --depth 1 origin tag "${{ steps.previous.outputs.tag }}"
            git worktree add -q /tmp/previous-src "${{ steps.previous.outputs.tag }}"
            (cd /tmp/previous-src && cargo pgrx install --release --no-default-features \
               --features "pg${PG_MAJOR}" --pg-config "$pg_config" --sudo)
          fi
          sudo -u postgres psql -p "${PGPORT}" \
            -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_tviews';"
          sudo pg_ctlcluster "${PG_MAJOR}" main restart

      - name: Create fixture TVIEWs with the previous release
        if: steps.previous.outputs.skip != 'true'
        run: ./test/upgrade/upgrade_check.sh before

      - name: Install the commit under test
        if: steps.previous.outputs.skip != 'true'
        run: |
          # Overwriting a loaded library crashes the backends using it: stop first.
          sudo pg_ctlcluster "${PG_MAJOR}" main stop
          cargo pgrx install --release --no-default-features --features "pg${PG_MAJOR}" \
            --pg-config "/usr/lib/postgresql/${PG_MAJOR}/bin/pg_config" --sudo
          sudo pg_ctlcluster "${PG_MAJOR}" main start

      - name: Update (or drop and recreate) and compare with a fresh install
        if: steps.previous.outputs.skip != 'true'
        run: ./test/upgrade/upgrade_check.sh after "${{ steps.previous.outputs.mode }}"
