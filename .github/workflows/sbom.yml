name: Generate SBOM

# An SBOM and its vulnerability scan on demand. The release (release.yml)
# generates, signs and attaches the SBOM of each tag.
on:
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install SBOM tools
        run: |
          cargo install --locked cargo-sbom
          cargo install --locked cargo-cyclonedx

      - name: Install pgrx
        run: cargo install --locked cargo-pgrx --version 0.17.0

      - name: Generate SBOM
        # Pass the ref name as the version so the generated filenames match the
        # scan-ref and release-attach steps below (the script otherwise derives
        # the version from Cargo.toml, which never matched github.ref_name).
        run: ./scripts/generate-sbom.sh "${{ github.ref_name }}"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/*

      - name: Scan SBOM for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'sbom'
          scan-ref: 'sbom/pg_tviews-${{ github.ref_name }}.cyclonedx.json'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'sbom-trivy-results.sarif'

      - name: Upload SBOM vulnerability scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'sbom-trivy-results.sarif'
