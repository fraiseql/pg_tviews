name: Generate SBOM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install SBOM tools
        run: |
          cargo install cargo-sbom
          cargo install cargo-cyclonedx

      - name: Install pgrx
        run: cargo install --locked cargo-pgrx --version 0.17.0

      - name: Generate SBOM
        # Pass the ref name as the version so the generated filenames match the
        # scan-ref and release-attach steps below (the script otherwise derives
        # the version from Cargo.toml, which never matched github.ref_name).
        run: ./scripts/generate-sbom.sh "${{ github.ref_name }}"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/*

      - name: Scan SBOM for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'sbom'
          scan-ref: 'sbom/pg_tviews-${{ github.ref_name }}.cyclonedx.json'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'sbom-trivy-results.sarif'

      - name: Upload SBOM vulnerability scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'sbom-trivy-results.sarif'

      - name: Attach SBOM to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          # Version-specific (not a wildcard) so a stray/stale sbom/ file can never
          # be re-attached to a release.
          files: |
            sbom/pg_tviews-${{ github.ref_name }}.spdx.json
            sbom/pg_tviews-${{ github.ref_name }}.cyclonedx.json
            sbom/pg_tviews-${{ github.ref_name }}.sbom.txt