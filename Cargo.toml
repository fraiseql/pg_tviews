[package]
name = "pg_tviews"
version = "0.1.0-beta.17"
edition = "2024"
authors = ["Lionel Hamayon <lionel.hamayon@evolution-digitale.fr>"]
description = "Transactional materialized views with incremental refresh for PostgreSQL"
license = "MIT"
repository = "https://github.com/fraiseql/pg_tviews"
homepage = "https://github.com/fraiseql/pg_tviews"
documentation = "https://github.com/fraiseql/pg_tviews"
readme = "README.md"
keywords = ["postgresql", "materialized-views", "incremental-refresh", "database", "pgrx"]
categories = ["database"]
exclude = [".phases/", "test/", ".github/", "scripts/", "sbom/"]

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pgrx_embed_pg_tviews"
path = "./src/bin/pgrx_embed.rs"

[dependencies]
pgrx = "=0.17.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.0"
bincode = "1.3"
flate2 = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sqlparser = "0.50"
lazy_static = "1.4"

[dev-dependencies]
pgrx-tests = "=0.17.0"

[features]
default = ["pg18"]
pg13 = ["pgrx/pg13", "pgrx-tests/pg13"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

[profile.dev]
panic = "unwind"

 [profile.release]
 panic = "unwind"
 opt-level = 3
 lto = "fat"
 codegen-units = 1

 [lints.clippy]
 all = { level = "deny", priority = -1 }
 pedantic = { level = "deny", priority = -1 }
 # Disable specific lints that conflict with PostgreSQL FFI / pgrx idioms.
 # These are the project's deliberate, reviewed exceptions to clippy::pedantic.
 missing_errors_doc = "allow"  # FFI functions often can't document all Postgres errors
 missing_panics_doc = "allow"  # internal invariants; most "panics" are pgrx error!() conversions
 module_name_repetitions = "allow"  # pg_tviews_ prefix is intentional
 too_many_lines = "allow"  # SQL-generating and FFI dispatch functions are long by nature
 similar_names = "allow"  # pk/fk/oid/tv/tb domain names are intentionally similar
 struct_field_names = "allow"  # catalog structs mirror PostgreSQL column names
 unnecessary_wraps = "allow"  # Result-returning signatures kept uniform across the DDL API
 manual_let_else = "allow"  # explicit match reads clearer in FFI null-check paths
 match_same_arms = "allow"  # XactEvent / NodeTag arms kept explicit for clarity
 cast_sign_loss = "allow"  # PostgreSQL OID/SPI integer casts are intentional and bounded
 non_std_lazy_statics = "allow"  # lazy_static! is used deliberately for session-local state

